<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="20" y="10" width="760" height="260" rx="12" ry="12" fill="#eff1f5" stroke="#ccd0da" stroke-width="1" filter="url(#shadow)"/>

  <!-- Title Bar -->
  <rect x="20" y="10" width="760" height="36" rx="12" ry="12" fill="#e6e9ef"/>
  <rect x="20" y="34" width="760" height="12" fill="#e6e9ef"/>

  <!-- Traffic Lights -->
  <circle cx="46" cy="28" r="6" fill="#ed6a5e"/>
  <circle cx="68" cy="28" r="6" fill="#f9bd4e"/>
  <circle cx="90" cy="28" r="6" fill="#61c554"/>

  <!-- Title Bar Text -->
  <text x="400" y="33" text-anchor="middle" font-family="SF Mono, Menlo, Monaco, monospace" font-size="13" fill="#8c8fa1">krishna@macbook-pro — zsh — 80×24</text>

  <!-- Terminal Content -->
  <text x="40" y="76" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="14">
