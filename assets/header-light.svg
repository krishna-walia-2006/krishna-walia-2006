    <tspan fill="#4c4f69" dx="8">Role:</tspan>
    <tspan fill="#40a02b"> Aspiring Software Engineer</tspan>
  </text>
  <text x="40" y="142" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="13">
