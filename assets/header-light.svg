    <tspan fill="#4c4f69" dx="20">Streak:</tspan>
    <tspan fill="#40a02b"> 180+ Days Active Coding 🔥</tspan>
  </text>

  <!-- Prompt -->
  <text x="40" y="240" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="14">
    <tspan fill="#40a02b">➜</tspan>
    <tspan fill="#1e66f5"> ~</tspan>
    <tspan fill="#8c8fa1"> █</tspan>
  </text>

  <!-- Color palette -->
