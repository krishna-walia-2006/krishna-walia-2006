    <tspan fill="#4c4f69" dx="0">LeetCode:</tspan>
    <tspan fill="#40a02b"> 1722 Rating (Top 12.32% Worldwide)</tspan>
  </text>
  <text x="40" y="182" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="13">
