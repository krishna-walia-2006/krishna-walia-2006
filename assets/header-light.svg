    <tspan fill="#4c4f69" dx="0">Degree:</tspan>
    <tspan fill="#40a02b"> B.Tech CSE (2024-2028)</tspan>
  </text>
  <text x="40" y="162" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="13">
