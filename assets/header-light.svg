    <tspan fill="#4c4f69" dx="8">Stack:</tspan>
    <tspan fill="#40a02b"> C++, Java, Node.js, Express, React, MongoDB</tspan>
  </text>
  <text x="40" y="202" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="13">
